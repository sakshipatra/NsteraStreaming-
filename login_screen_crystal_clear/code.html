<!DOCTYPE html><html class="dark" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#0d0d0e;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;display:inline-block;vertical-align:middle;}</style><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary-fixed-dim": "#ffb4aa", "tertiary-fixed-dim": "#a7c8ff", "on-background": "#f4f4f5", "on-secondary-fixed-variant": "#454747", "tertiary-fixed": "#d5e3ff", "secondary-fixed": "#e2e2e2", "secondary-fixed-dim": "#c6c6c7", "on-tertiary-container": "#f8f9ff", "on-error": "#690005", "on-error-container": "#ffdad6", "on-primary-container": "#fff7f6", "tertiary-container": "#0072d7", "surface-bright": "#27272a", "surface": "#0d0d0e", "surface-container-high": "#27272a", "surface-variant": "#27272a", "surface-dim": "#09090b", "outline-variant": "#3f3f46", "error-container": "#93000a", "primary-container": "#e50914", "surface-container-highest": "#3f3f46", "surface-container": "#18181b", "primary": "#ffb4aa", "on-secondary": "#2f3131", "on-primary-fixed-variant": "#930007", "inverse-primary": "#c0000c", "background": "#0d0d0e", "surface-container-lowest": "#000000", "inverse-on-surface": "#313030", "secondary-container": "#27272a", "inverse-surface": "#f4f4f5", "on-tertiary": "#003061", "surface-container-low": "#121214", "error": "#ffb4ab", "primary-fixed": "#ffdad5", "on-secondary-fixed": "#1a1c1c", "outline": "#52525b", "secondary": "#a1a1aa", "on-surface-variant": "#d4d4d8", "on-surface": "#f4f4f5", "tertiary": "#a7c8ff", "on-tertiary-fixed-variant": "#004689", "on-primary": "#690003", "on-tertiary-fixed": "#001b3c", "on-secondary-container": "#b4b5b5", "surface-tint": "#e50914", "on-primary-fixed": "#410001" }, borderRadius: { "DEFAULT": "0.125rem", "lg": "0.375rem", "xl": "0.5rem", "2xl": "0.875rem", "full": "9999px" }, spacing: { "margin-desktop": "4rem", "gutter-desktop": "1.5rem", "gutter": "1rem", "margin-tablet": "2.5rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem", "margin": "1rem", "space-xl": "2.5rem" }, fontFamily: { "headline-sm": ["Inter"], "display-hero-mobile": ["Bebas Neue"], "label-md": ["Inter"], "headline-lg": ["Bebas Neue"], "label-sm": ["Inter"], "headline-xl": ["Bebas Neue"], "body-lg": ["Inter"], "body-sm": ["Inter"], "display-hero": ["Bebas Neue"], "body-md": ["Inter"], "headline-xl-mobile": ["Bebas Neue"] } } } };</script></head><body class="bg-[#0d0d0e] text-[#f4f4f5] font-['Inter'] flex flex-col min-h-screen pt-safe pb-safe selection:bg-[#e50914] selection:text-white"><main class="flex flex-col relative w-full bg-[#0d0d0e] min-h-screen"><div class="flex flex-col w-full max-w-md mx-auto px-4 py-6 pb-12 justify-start">
<!-- Crisp Razor-Sharp Cinema Header Card (100% Vector & High Contrast) -->
<div class="relative w-full rounded-2xl overflow-hidden mb-6 bg-[#121214] border border-[#27272a] shadow-xl">
<!-- Precision Vector Grid & Cinema Lighting Geometry -->
<div class="relative w-full h-44 bg-[#141417] flex flex-col justify-between p-5 overflow-hidden">
<!-- Geometric Vector Ray Lines for Crystal Sharp Visual Interest -->
<svg class="absolute inset-0 w-full h-full pointer-events-none opacity-40" preserveAspectRatio="none" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="rayGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#e50914" stop-opacity="0.3"></stop>
<stop offset="50%" stop-color="#b91c1c" stop-opacity="0.08"></stop>
<stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
</linearGradient>
</defs>
<line stroke="#27272a" stroke-width="1" x1="0" x2="400" y1="45" y2="45"></line>
<line stroke="#27272a" stroke-width="1" x1="0" x2="400" y1="90" y2="90"></line>
<line stroke="#27272a" stroke-width="1" x1="0" x2="400" y1="135" y2="135"></line>
<polygon fill="url(#rayGrad)" points="20,0 220,180 140,180 0,60"></polygon>
<circle cx="340" cy="50" fill="none" r="90" stroke="#3f3f46" stroke-dasharray="4 4" stroke-width="1"></circle>
<circle cx="340" cy="50" fill="none" r="50" stroke="#e50914" stroke-opacity="0.25" stroke-width="1.5"></circle>
</svg>
<!-- Top Bar: Crisp Brand Logo & Help Button -->
<div class="relative z-10 flex items-center justify-between w-full">
<!-- Razor-Sharp NSTERA Logo -->
<div class="flex items-center tracking-tight select-none">
<span class="font-['Bebas_Neue'] text-[#e50914] text-[40px] leading-none font-bold tracking-normal">N</span>
<span class="font-['Bebas_Neue'] text-white text-[28px] leading-none font-bold tracking-[0.22em] ml-1.5 pt-0.5">STERA</span>
</div>
<!-- Help Button with Sharp 1px Border -->
<a class="px-3.5 py-1.5 rounded-lg bg-[#18181b] hover:bg-[#27272a] text-white text-[13px] font-semibold tracking-wide transition-colors duration-150 flex items-center gap-1.5 border border-[#3f3f46] shadow-sm" href="#">
<span class="">Help</span>
<span class="material-symbols-outlined text-[17px] text-[#a1a1aa]">help_outline</span>
</a>
</div>
<!-- Badge: Cinema Mode Active with Sharp Dot Indicator -->
<div class="relative z-10 flex items-center gap-2 self-start bg-[#09090b] px-3 py-1.5 rounded-full border border-[#27272a] shadow-sm">
<span class="w-2 h-2 rounded-full bg-[#e50914] ring-2 ring-[#e50914]/30"></span>

</div>
</div>
</div>
<!-- Sign In Form Container: Crisp Dark Card & Razor-Sharp Hierarchy -->
<div class="w-full bg-[#18181b] rounded-2xl p-6 sm:p-7 shadow-2xl flex flex-col gap-6 border border-[#27272a]">
<!-- Header Text -->
<div class="flex flex-col gap-1.5">
<h1 class="font-['Bebas_Neue'] text-[#ffffff] tracking-[0.05em] uppercase text-[40px] leading-none font-normal">SIGN IN</h1>
<p class="text-[#a1a1aa] text-[14px] leading-normal font-normal">Access unlimited movies, prestige originals, and live theater premieres.</p>
</div>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Email / Mobile Input -->
<div class="flex flex-col gap-2">
<label class="text-[#f4f4f5] text-[14px] font-semibold tracking-normal" for="login-identifier">
        Email or mobile number
      </label>
<div class="relative flex items-center bg-[#0f0f12] rounded-xl border-[1.5px] border-[#3f3f46] focus-within:border-[#e50914] focus-within:bg-[#141418] transition-colors duration-150 h-13">
<span class="material-symbols-outlined absolute left-3.5 text-[#a1a1aa] text-[20px] pointer-events-none">mail</span>
<input autocomplete="username" class="w-full pl-11 pr-4 py-3 bg-transparent text-[#ffffff] text-[15px] font-medium placeholder:text-[#71717a] focus:outline-none border-none ring-0 focus:ring-0" id="login-identifier" name="identifier" placeholder="name@nstera.com" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="text-[#f4f4f5] text-[14px] font-semibold tracking-normal" for="login-password">Password</label>
<a class="text-[13px] text-[#a1a1aa] hover:text-[#ffffff] underline underline-offset-4 transition-colors font-medium" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center bg-[#0f0f12] rounded-xl border-[1.5px] border-[#3f3f46] focus-within:border-[#e50914] focus-within:bg-[#141418] transition-colors duration-150 h-13">
<span class="material-symbols-outlined absolute left-3.5 text-[#a1a1aa] text-[20px] pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full pl-11 pr-11 py-3 bg-transparent text-[#ffffff] text-[15px] font-medium placeholder:text-[#71717a] focus:outline-none border-none ring-0 focus:ring-0" id="login-password" name="password" placeholder="Enter your password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 p-1.5 text-[#a1a1aa] hover:text-[#ffffff] focus:outline-none flex items-center justify-center transition-colors" id="toggle-password-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center justify-between pt-0.5">
<label class="flex items-center gap-3 cursor-pointer select-none group">
<input checked="" class="peer sr-only" id="remember-me-checkbox" type="checkbox">
<div class="w-5 h-5 rounded bg-[#0f0f12] border-[1.5px] border-[#3f3f46] flex items-center justify-center peer-checked:bg-[#e50914] peer-checked:border-[#e50914] transition-colors">
<span class="material-symbols-outlined text-[16px] text-white font-bold opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="text-[#d4d4d8] group-hover:text-white text-[14px] font-normal transition-colors">Remember me on this device</span>
</label>
</div>
<!-- Primary CTA Button: Razor-Sharp Crimson Red -->
<button class="w-full h-13 py-3.5 bg-[#e50914] hover:bg-[#cc0812] active:bg-[#b00710] text-white font-['Bebas_Neue'] uppercase tracking-[0.1em] rounded-xl flex items-center justify-center gap-2 transition-colors duration-150 cursor-pointer text-[22px] border border-[#ff4d4f]/30 shadow-md mt-1" id="submit-signin-btn" type="submit">
<span class="">SIGN IN</span>
<span class="material-symbols-outlined text-[22px] font-bold">arrow_forward</span>
</button>
</form>
<!-- High-Contrast OR Divider -->
<div class="flex items-center gap-4 my-0.5">
<div class="flex-1 h-[1px] bg-[#3f3f46]"></div>
<span class="text-[#a1a1aa] uppercase tracking-[0.15em] text-[11px] font-bold">OR</span>
<div class="flex-1 h-[1px] bg-[#3f3f46]"></div>
</div>
<!-- Secondary Button: Sign-In Code -->
<button class="w-full h-12 py-3 bg-[#121215] hover:bg-[#202024] text-[#f4f4f5] font-semibold text-[14px] rounded-xl flex items-center justify-center gap-2.5 transition-colors duration-150 cursor-pointer border border-[#3f3f46]" type="button">
<span class="material-symbols-outlined text-[20px] text-[#a1a1aa]">dialpad</span>
<span class="">Use a Sign-In Code</span>
</button>
<!-- Account Switch Card: Clear, High Contrast, One-Line Switch Button -->
<div class="bg-[#121215] rounded-xl p-3.5 flex items-center justify-between border border-[#27272a] gap-3">
<div class="flex items-center gap-3 min-w-0">
<div class="w-10 h-10 rounded-lg bg-[#0072d7] flex items-center justify-center text-white font-bold text-[14px] tracking-wide shrink-0 border border-blue-400/20">
        JD
      </div>
<div class="flex flex-col truncate">
<span class="text-white font-semibold text-[14px] truncate leading-tight">Jane Doe</span>
<span class="text-[#a1a1aa] text-[12px] truncate mt-0.5">Standard HD plan</span>
</div>
</div>
<button class="shrink-0 px-4 py-1.5 bg-[#27272a] hover:bg-[#3f3f46] active:bg-[#52525b] text-white text-[13px] font-medium rounded-lg transition-colors border border-[#3f3f46] whitespace-nowrap" type="button">
      Switch
    </button>
</div>
<!-- Sign Up Footer Link -->
<div class="pt-0.5 flex flex-col gap-1">
<p class="text-[#a1a1aa] text-[14px]">
      New to Nstera?
      <a class="text-white hover:text-[#e50914] font-semibold ml-1 underline underline-offset-4 transition-colors" href="#">Sign up now.</a>
</p>
</div>
<!-- Legal / Captcha Note -->
<div>
<p class="text-[#71717a] leading-relaxed text-[12px]">
      This page is protected by Google reCAPTCHA to ensure you are not a bot.
      <a class="text-[#a1a1aa] hover:text-white underline underline-offset-2 transition-colors" href="#">Learn more.</a>
</p>
</div>
</div>
<!-- Interactive Password Toggle Script -->
<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('login-password');
    const toggleIcon = document.getElementById('password-toggle-icon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
        toggleIcon.classList.toggle('text-[#e50914]', isPassword);
        toggleIcon.classList.toggle('text-[#a1a1aa]', !isPassword);
      });
    }
  })();
</script>
</div></main>

</body></html>

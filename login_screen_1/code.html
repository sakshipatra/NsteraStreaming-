<!-- Sign In Card Container: Crisp Elevation, Expansive Spacing & Larger Typography -->
<div class="w-full bg-[#181818] rounded-2xl p-7 sm:p-8 shadow-2xl flex flex-col gap-6 border border-[#2d2d2d]" style="-webkit-font-smoothing: antialiased;"><div class="flex flex-col gap-1.5"><h1 class="font-headline-xl text-[#ffffff] tracking-wider uppercase text-[38px] leading-tight font-black">Sign In</h1><p class="font-body-md text-[#a3a3a3] text-[15px] leading-relaxed">Access unlimited movies, prestige originals, and live theater premieres.</p></div><form class="flex flex-col gap-5" onsubmit="event.preventDefault();"><div class="flex flex-col gap-2"><label class="font-label-md text-[#e5e2e1] flex items-center justify-between text-[14px] font-semibold tracking-wide" for="login-identifier"><span class="">Email or mobile number</span><span class="font-body-sm text-[#a3a3a3] hidden" id="identifier-hint">Required</span></label><div class="relative flex items-center bg-[#242424] rounded-xl focus-within:bg-[#2a2a2a] focus-within:border-[#e50914] border border-[#383838] transition-colors duration-150 h-14"><span class="material-symbols-outlined absolute left-3.5 text-[#a3a3a3] text-[22px] pointer-events-none">mail</span><input autocomplete="username" class="w-full pl-12 pr-4 py-3 bg-transparent text-[#ffffff] font-body-lg text-body-lg placeholder:text-[#6e6e6e] focus:outline-none selection:bg-[#e50914] selection:text-white" id="login-identifier" name="identifier" placeholder="name@nstera.com" required="" type="text"></div></div><div class="flex flex-col gap-2"><div class="flex items-center justify-between"><label class="font-label-md text-[#e5e2e1] text-[14px] font-semibold tracking-wide" for="login-password">Password</label><a class="font-label-sm text-[13px] text-[#a3a3a3] hover:text-[#ffffff] underline underline-offset-4 transition-colors font-medium" href="#">Forgot password?</a></div><div class="relative flex items-center bg-[#242424] rounded-xl focus-within:bg-[#2a2a2a] focus-within:border-[#e50914] border border-[#383838] transition-colors duration-150 h-14"><span class="material-symbols-outlined absolute left-3.5 text-[#a3a3a3] text-[22px] pointer-events-none">lock</span><input autocomplete="current-password" class="w-full pl-12 pr-12 py-3 bg-transparent text-[#ffffff] font-body-lg text-body-lg placeholder:text-[#6e6e6e] focus:outline-none selection:bg-[#e50914] selection:text-white" id="login-password" name="password" placeholder="Enter your password" required="" type="password"><button aria-label="Toggle password visibility" class="absolute right-3.5 p-2 text-[#a3a3a3] hover:text-[#ffffff] focus:outline-none flex items-center justify-center transition-colors" id="toggle-password-btn" type="button"><span class="material-symbols-outlined text-[22px]" id="password-toggle-icon">visibility_off</span></button></div></div><div class="flex items-center justify-between py-0.5"><label class="flex items-center gap-3 cursor-pointer select-none group"><input checked="" class="peer sr-only" id="remember-me-checkbox" type="checkbox"><div class="w-5 h-5 rounded bg-[#242424] border border-[#383838] flex items-center justify-center peer-checked:bg-[#e50914] peer-checked:border-[#e50914] transition-colors"><span class="material-symbols-outlined text-[16px] text-white opacity-0 peer-checked:opacity-100 transition-opacity font-bold">check</span></div><span class="font-body-md text-[#c6c6c7] group-hover:text-white transition-colors text-[14px]">Remember me on this device</span></label></div><button class="w-full h-14 bg-[#e50914] hover:bg-[#c0000c] active:scale-[0.99] text-white font-headline-lg uppercase tracking-wider rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all duration-150 mt-2 cursor-pointer text-[22px] font-bold border border-[#ff3b30]/20" id="submit-signin-btn" type="submit"><span class="tracking-widest">Sign In</span><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button></form><div class="flex items-center gap-4 my-1"><div class="flex-1 h-px bg-[#2d2d2d]"></div><span class="font-label-sm text-[#a3a3a3] uppercase tracking-widest text-[11px] font-semibold">OR</span><div class="flex-1 h-px bg-[#2d2d2d]"></div></div><button class="w-full h-13 py-3.5 bg-[#242424] hover:bg-[#2c2c2c] active:scale-[0.99] text-[#ffffff] font-label-md text-label-md rounded-xl flex items-center justify-center gap-2.5 transition-colors duration-150 cursor-pointer border border-[#383838] shadow-sm" type="button"><span class="material-symbols-outlined text-[20px] text-[#a3a3a3]">dialpad</span><span class="text-[14px] font-semibold tracking-wide">Use a Sign-In Code</span></button><div class="bg-[#202020] rounded-xl p-3.5 flex items-center justify-between border border-[#2d2d2d]"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-[#0072d7] flex items-center justify-center text-white font-label-md text-[15px] uppercase font-bold shadow-sm">JD</div><div class="flex flex-col"><span class="font-label-md text-[#ffffff] font-semibold text-[14px]">Jane Doe</span><span class="font-body-sm text-[#a3a3a3] text-[12px]">Standard HD plan</span></div></div><button class="px-3 py-1.5 bg-[#2a2a2a] hover:bg-[#353534] rounded-lg text-[#ffffff] font-label-sm text-label-sm transition-colors border border-[#3d3d3d] text-[12px] font-medium" type="button">Switch</button></div><div class="pt-1 flex flex-col gap-1"><p class="font-body-md text-[#a3a3a3] text-[14px]">New to Nstera? <a class="font-label-md text-white hover:text-[#e50914] transition-colors ml-1 underline underline-offset-4 font-semibold" href="#">Sign up now.</a></p></div><div class="pt-2"><p class="font-body-sm text-[#7e7e7e] leading-relaxed text-[12px]">This page is protected by Google reCAPTCHA to ensure you are not a bot. <a class="text-[#a3a3a3] hover:text-white hover:underline underline-offset-2 transition-colors" href="#">Learn more.</a></p></div></div>
<!-- Micro-Interactivity Script: Password Toggle & Tactile Feedback -->
<script>
    (function() {
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('login-password');
      const toggleIcon = document.getElementById('password-toggle-icon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
          toggleIcon.classList.toggle('text-primary-container', isPassword);
        });
      }
    })();
  </script>
